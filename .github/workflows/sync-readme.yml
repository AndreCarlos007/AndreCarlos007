name: Sync README from Private Repo

on:
  schedule:
    - cron: "0 * * * *" 
  workflow_dispatch:  

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositório Privado
        uses: actions/checkout@v4
        with:
          repository: AndreCarlos007/perfil-readme  # Substitua pelo nome do seu repositório privado
          token: ${{ secrets.PAT_README }}

      - name: Copiar README.md para Público
        run: cp README.md $GITHUB_WORKSPACE/

      - name: Commit e Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions@users.noreply.github.com"
          git add README.md
          git commit -m "Atualizando README automaticamente"
          git push
